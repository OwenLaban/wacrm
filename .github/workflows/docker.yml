name: Build & Push Image

# Trigger: setiap push ke main -> image baru terbentuk otomatis
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Login ke GitHub Container Registry (ghcr.io)
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build & push pakai Dockerfile root
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/owenlaban/wacrm:latest
