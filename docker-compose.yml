version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: wacrm_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: wacrm
      POSTGRES_USER: wacrm
      POSTGRES_PASSWORD: wacrm123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: wacrm_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://wacrm:wacrm123@db:5432/wacrm
      WA_GATEWAY_PROVIDER: fonnte  # fonnte | wablas | mock
      FONNTE_TOKEN: ${FONNTE_TOKEN:-}
      WABLAS_TOKEN: ${WABLAS_TOKEN:-}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-ganti-di-production}
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
